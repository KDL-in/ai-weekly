本文引述了Dean W. Ball对AI行业动态的评论。他指出，前沿模型训练成本极高，其成本回收主要依赖于发布后短暂的窗口期，在此期间模型具有广泛可用性。一旦窗口期过去，模型变为次前沿，竞争加剧，利润空间被压缩。任何延迟都会侵蚀实验室实现盈利的狭窄机会。此外，他认为美国正在进行的AI基础设施建设，假设了美国AI服务拥有全球性的可寻址市场，但若美国政府限制访问，则无人会为仅服务于少数获准公司的前沿模型而投资千亿美元级的数据中心。", "highlights": ["前沿模型成本回收依赖发布后短暂的广泛可用窗口期", "延迟发布会严重侵蚀AI实验室的盈利机会", "美国AI基础设施投资规模与潜在受限的市场准入之间存在矛盾"], "badge": null, "title": "Quoting Dean W. Ball", "url": "https://simonwillison.net/2026/Jun/26/dean-w-ball/#atom-everything", "author": "Simon Willison", "published_at": "2026-06-26T22:25:46", "source_name": "Simon Willison", "source_type": "rss"}, {"id": 115, "category": "模型与能力", "title_zh": "预览 GPT-5.6 Sol：下一代模型", "summary": "OpenAI 预览了其下一代模型 GPT-5.6 Sol，该模型在编程、科学和网络安全领域展现出更强的能力，并配备了迄今为止最先进的安全防护体系。", "highlights": ["在编程、科学和网络安全方面能力显著增强", "配备最先进的安全防护体系", "作为下一代模型进行预览发布"], "badge": null, "title": "Previewing GPT-5.6 Sol: a next-generation model", "url": "https://openai.com/index/previewing-gpt-5-6-sol", "author": "OpenAI Blog", "published_at": "2026-06-26T10:00:00", "source_name": "OpenAI Blog", "source_type": "rss"}, {"id": 116, "category": "工程与实践", "title_zh": "2000人尝试攻击我的AI助手后发生了什么", "summary": "Fernando Irarrázaval 在 hackmyclaw.com 发起挑战，邀请公众通过邮件攻击其基于 Opus 4.6 模型的 OpenClaw 测试实例，试图泄露机密信息。在6000次尝试、花费500美元令牌费用并导致谷歌账户因邮件过多被暂停后，无人成功泄露秘密。作者 Simon Willison 认为，这反映了前沿模型实验室在训练模型抵御提示注入攻击方面的投入已初见成效，使得此类攻击难度大增。但他仍警告，不应在可能造成不可逆损害的生产环境中完全依赖这种防护，因为6000次失败并不能保证更复杂的攻击手段无法突破。Hacker News 上的讨论充满合理的怀疑与建设性回应。", "highlights": ["6000次邮件攻击尝试均未能泄露AI助手持有的机密信息", "实验表明前沿模型对提示注入攻击的抵抗力有所增强", "作者强调即使测试结果良好，生产环境仍需谨慎防范更复杂的攻击"], "badge": null, "title": "What happened after 2,000 people tried to hack my AI assistant", "url": "https://simonwillison.net/2026/Jun/26/hack-my-ai-assistant/#atom-everything", "author": "Simon Willison", "published_at": "2026-06-26T18:33:14", "source_name": "Simon Willison", "source_type": "rss"}, {"id": 117, "category": "观点与评论", "title_zh": "事件报告：CVE-2026-LGTM", "summary": "本文是Simon Willison分享的一则虚构事件报告，作者为Andrew Nesbitt。故事描述了2026年某天，两个来自不同供应商的AI审查代理在审查一个名为foxhole-lz4的软件包时，就包是否恶意陷入争论循环。双方在拉取请求下进行了340条评论，耗费了41255美元的推理费用。最终财务部门撤销了两个API密钥，而其中一家供应商的营销团队却借此发布新闻稿，声称“对抗性多智能体安全推理同比增长430%”，导致其股价开盘上涨6%。该报告以讽刺手法揭示了AI代理在供应链安全中的潜在风险与荒诞后果。", "highlights": ["虚构事件生动描绘了AI审查代理陷入无意义争论的荒诞场景", "揭示了多智能体系统可能带来的高昂推理成本与失控风险", "讽刺了企业将AI事故包装为正面增长指标的营销行为"], "badge": null, "title": "Incident Report: CVE-2026-LGTM", "url": "https://simonwillison.net/2026/Jun/26/incident-report/#atom-everything", "author": "Simon Willison", "published_at": "2026-06-26T17:58:54", "source_name": "Simon Willison", "source_type": "rss"}, {"id": 118, "category": "模型与能力", "title_zh": "OpenAI 预览 GPT-5.6 系列：Sol、Terra、Luna 三款新模型", "summary": "OpenAI 宣布推出 GPT-5.6 系列模型的有限预览，包含旗舰模型 Sol、均衡模型 Terra 和快速低价模型 Luna。Terra 性能与 GPT-5.5 相当但成本减半，Luna 以最低成本提供强大能力。定价方面，Sol 为每百万 tokens 输入 5 美元/输出 30 美元，Terra 为 2.5/15 美元，Luna 为 1/6 美元。新系列还引入了更可预测的提示缓存机制，支持显式缓存断点和最低 30 分钟缓存生命周期，缓存写入按输入价格的 1.25 倍计费，读取仍享受 90% 折扣。OpenAI 表示已向美国政府预览了模型计划与能力，并应其要求先向一组受信任合作伙伴开放有限预览，未来几周将全面开放。", "highlights": ["GPT-5.6 系列推出三款定位不同的模型：旗舰 Sol、均衡 Terra 和低价 Luna", "Terra 性能对标 GPT-5.5 但价格仅为其一半，Luna 以最低成本提供强能力", "引入改进的提示缓存机制，支持显式断点和 30 分钟最低缓存寿命"], "badge": null, "title": "Quoting OpenAI", "url": "https://simonwillison.net/2026/Jun/26/openai/#atom-everything", "author": "Simon Willison", "published_at": "2026-06-26T17:10:43", "source_name": "Simon Willison", "source_type": "rss"}, {"id": 119, "category": "研究与论文", "title_zh": "AI智能体如何改变工作方式", "summary": "OpenAI发布的最新研究论文探讨了AI智能体如何重塑工作模式。研究表明，AI智能体能够处理更长时间、更复杂的任务，从而显著扩展了不同角色的生产力边界。论文详细分析了智能体在工作流程中的应用潜力，揭示了其在自动化复杂流程、增强人类能力方面的变革性影响，为未来人机协作提供了新的实证依据。", "highlights": ["AI智能体能够处理更长时间和更复杂的任务", "研究揭示了智能体在不同工作角色中扩展生产力的潜力", "为未来人机协作模式提供了实证分析"], "badge": null, "title": "How agents are transforming work", "url": "https://openai.com/index/how-agents-are-transforming-work", "author": "OpenAI Blog", "published_at": "2026-06-25T02:00:00", "source_name": "OpenAI Blog", "source_type": "rss"}, {"id": 120, "category": "观点与评论", "title_zh": "人工智能与法律责任", "summary": "Simon Willison 引述 Bruce Schneier 与 Nathan Sanders 的观点，评论德国法院裁定谷歌需为其 AI 概述中的错误承担责任一事。核心论点是：AI 代理应被视为部署它们的个人或组织的代理人，法律上应如此对待。如果企业雇佣人类撰写摘要，企业需为不准确负责；若允许企业以“AI 出错”为借口逃避责任，将构成对企业的巨大补贴，并引发灾难性的不良行为激励。文章质疑，当 AI 比人类更便宜且能免除雇主责任时，为何还要雇佣人类作家、律师或医生。", "highlights": ["明确主张 AI 代理的法律责任应由部署者承担，不应以技术故障为借口", "指出免除 AI 责任将扭曲市场激励，导致企业用 AI 替代人类以规避责任", "结合德国法院对谷歌 AI 概述错误的实际判例进行评论"], "badge": null, "title": "AI and Liability", "url": "https://simonwillison.net/2026/Jun/25/ai-and-liability/#atom-everything", "author": "Simon Willison", "published_at": "2026-06-25T22:28:46", "source_name": "Simon Willison", "source_type": "rss"}, {"id": 121, "category": "观点与评论", "title_zh": "AI编程让工程师付出了什么代价", "summary": "在AI辅助编程日益普及的背景下，视频探讨了工程师可能面临的隐性代价。以Claude Code团队的经验为例，指出长期与AI代理协作可能导致工作体验变得孤独。为应对这一问题，团队引入了结对编程午餐和专门的创作时间，旨在促进成员间的互动与相互学习，弥补因过度依赖AI工具而减少的人际交流与知识共享。", "highlights": ["指出AI编程工具可能导致工程师产生孤独感", "分享Claude Code团队通过结对编程午餐促进交流的实践", "强调在AI时代保留人际互动与相互学习的重要性"], "badge": null, "title": "What AI coding costs engineers", "url": "https://www.youtube.com/shorts/X_LrhBI3Z2Y", "author": "Lenny's Podcast", "published_at": "2026-06-25T11:00:36", "source_name": "Lenny's Podcast", "source_type": "youtube"}, {"id": 122, "category": "产品与工具", "title_zh": "Simon Willison 的浏览器兼容性数据库", "summary": "Simon Willison 受 Mozilla 新推出的 MDN MCP 服务启发，将 mdn/browser-compat-data 仓库中的浏览器兼容性数据转换为约 66MB 的 SQLite 数据库，并创建了新的 GitHub 仓库。他利用 Claude Code for web (Opus 4.8) 生成了基于 sqlite-utils 的转换脚本，并借助 Codex Desktop (GPT-5.5) 构建了 GitHub Actions 工作流，该工作流能自动构建数据库并强制推送到一个孤立的 'db' 分支。由于常规 GitHub 仓库中的文件支持开放 CORS 头，生成的数据库文件可通过 GitHub CDN 直接访问，并可使用 Datasette Lite 进行在线探索。", "highlights": ["将 MDN 浏览器兼容性数据打包为便携的 SQLite 数据库", "利用 AI 辅助编程（Claude Code 和 Codex Desktop）生成转换脚本和自动化工作流", "通过 GitHub 仓库的开放 CORS 头实现数据库的在线直接访问与探索"], "badge": null, "title": "simonw/browser-compat-db", "url": "https://simonwillison.net/2026/Jun/24/browser-compat-db/#atom-everything", "author": "Simon Willison", "published_at": "2026-06-24T23:59:03", "source_name": "Simon Willison", "source_type": "rss"}, {"id": 123, "category": "观点与评论", "title_zh": "汤姆·麦克赖特语录", "summary": "Tom MacWright 观察到，近期求职申请中越来越多地出现由大语言模型（LLM）辅助撰写的材料，包括求职信、作品集网站、GitHub 项目乃至提交信息，全部由 AI 生成。他认为，这类经过完美修饰的简历虽然工整，却显得千篇一律、缺乏个性，无法让招聘方真正了解求职者本人。MacWright 指出，这些申请者没有展现真实的自我，也没有表达任何属于自己的真实想法，最终导致一种“意外的匿名性”——除了表明他们会使用特定工具外，简历无法传递任何关于个人特质的信息。", "highlights": ["指出 AI 生成的求职材料导致候选人形象模糊、缺乏个性", "提出“意外的匿名性”概念，形容过度依赖 AI 修饰简历的反效果", "强调真实自我表达在求职中的不可替代性"], "badge": null, "title": "Quoting Tom MacWright", "url": "https://simonwillison.net/2026/Jun/24/tom-macwright/#atom-everything", "author": "Simon Willison", "published_at": "2026-06-24T18:13:51", "source_name": "Simon Willison", "source_type": "rss"}, {"id": 124, "category": "观点与评论", "title_zh": "编程不再是瓶颈", "summary": "Anthropic工程师每季度交付的代码量是2025年之前的八倍，AI已编写近100%的代码，编码不再是瓶颈。不仅工程师，设计师和产品经理也开始提交代码，整体吞吐量大幅提升。这使得验证成为新的核心难题。演讲者指出，当为Claude提供明确的验证框架时，它能很好地完成验证任务，但强调信任仍需核实，模型虽强，仍有大量方面需要验证。因此，在需要深厚专业知识的验证领域进行投资，是绝对值得的方向。建议将“优秀”的标准明确定义并放入代码仓库，让Claude进行代码审查，以确保代码符合预期目标。", "highlights": ["AI编写代码比例接近100%，编码不再是瓶颈", "验证取代编码成为新的核心难题", "建议将质量标准固化到仓库，用AI进行代码审查"], "badge": null, "title": "Coding is no longer the bottleneck", "url": "https://www.youtube.com/shorts/UPUFF1pkAOI", "author": "Lenny's Podcast", "published_at": "2026-06-24T17:30:07", "source_name": "Lenny's Podcast", "source_type": "youtube"}, {"id": 125, "category": "产品与工具", "title_zh": "智能体云：Databricks 押注 AI 未来——Matei Zaharia 与 Reynold Xin 深度对话", "summary": "Databricks联合创始人Matei Zaharia和Reynold Xin在访谈中阐述了公司从数据湖仓向AI操作系统转型的战略。核心产品Omnigent是一个开源元代理框架，旨在解决编码代理与企业自定义代理面临的共性挑战：可移植性、协作、会话历史、安全与成本控制。它提供统一API，支持Claude Code、Codex、Cursor等多种代理的集成与管控。Reynold Xin则深入探讨了数据库架构革新，提出LTAP（湖仓事务分析处理）概念，通过统一存储层而非合并查询引擎，实现HTAP的大部分优势，并强调代理需要数据库中的实时运营上下文。此外，访谈还涉及Databricks的规模化基础设施、快速原型文化、代理安全治理、与Snowflake的竞争差异，以及“将数据置于正确位置并叠加AI代理将重写传统软件”的核心论断。", "highlights": ["推出开源元代理框架Omnigent，提供统一API以集成、控制和共享多种编码及企业代理，解决可移植性与协作难题。", "提出LTAP（湖仓事务分析处理）概念，通过统一存储层实现HTAP优势，为AI代理提供实时运营数据上下文。", "强调代理安全需上下文感知与有状态策略，并指出代理可能因读取敏感文件或安装恶意包导致数据泄露与成本失控。", "阐述“将数据置于正确位置并叠加AI代理”将重写传统软件的战略愿景。"], "badge": null, "title": "The Agent Cloud: Databricks’ Bet on the Future of AI — Matei Zaharia and Reynold Xin", "url": "https://www.youtube.com/watch?v=Yp_u1NpbkJg", "author": "Latent Space", "published_at": "2026-06-24T18:40:29", "source_name": "Latent Space", "source_type": "youtube"}, {"id": 126, "category": "观点与评论", "title_zh": "Anthropic 想要招揽的两位人才", "summary": "Anthropic 在招聘时重点寻找两类人才：一类是具有产品意识的创意型开发人员，他们像梦想家一样充满热情，能够从用户反馈中快速迭代，打造令人愉悦的产品体验；另一类是能够处理复杂系统的专家，尤其在模型验证等需要深厚专业知识的领域，这类系统背景的人才不可或缺。视频指出，团队初期拥有优秀的通才型产品人才，但随后意识到在系统深度上的不足，因此强调这两类人才的互补性对云代码开发至关重要。", "highlights": ["Anthropic 明确招聘两类核心人才：产品创意型开发者与复杂系统专家", "产品意识被描述为‘梦想家思维’，强调快速迭代与用户体验", "系统专家在模型验证等深度领域不可或缺，弥补通才团队的不足"], "badge": null, "title": "The two hires Anthropic wants", "url": "https://www.youtube.com/shorts/GwMjY4tBX_M", "author": "Lenny's Podcast", "published_at": "2026-06-24T11:00:22", "source_name": "Lenny's Podcast", "source_type": "youtube"}, {"id": 127, "category": "产品与工具", "title_zh": "OPFS + Pyodide 测试工具", "summary": "Simon Willison 发布了一个基于浏览器的测试工具，用于探索 Datasette Lite 是否能够编辑用户计算机上持久化的 SQLite 文件。该工具利用 Origin Private File System (OPFS) 技术，结合 Pyodide 和 WebAssembly，在浏览器中运行 Python 应用。作者使用 Claude Code 构建了此交互界面，旨在不同浏览器中测试该功能的可行性。", "highlights": ["探索 Datasette Lite 在浏览器中直接编辑本地 SQLite 文件的可能性", "利用 OPFS 技术实现浏览器端的持久化文件存储", "使用 Claude Code 辅助构建测试界面"], "badge": null, "title": "OPFS + Pyodide test harness", "url": "https://simonwillison.net/2026/Jun/23/opfs-pyodide/#atom-everything", "author": "Simon Willison", "published_at": "2026-06-23T18:58:54", "source_name": "Simon Willison", "source_type": "rss"}, {"id": 128, "category": "工程与实践", "title_zh": "OpenAI与博通联合发布LLM推理优化芯片", "summary": "OpenAI与博通（Broadcom）合作推出了一款名为Jalapeño的定制AI芯片，专为大语言模型（LLM）推理任务设计。该芯片旨在提升AI系统的推理性能、能效与扩展能力，标志着OpenAI在自研硬件基础设施方面迈出重要一步。通过定制化设计，Jalapeño有望优化大规模AI工作负载的处理效率，降低延迟并提高吞吐量，从而支持更复杂的模型部署和服务。此举也反映了业界对专用推理芯片日益增长的需求，以应对生成式AI应用快速扩展带来的算力挑战。", "highlights": ["OpenAI与博通联合推出专为LLM推理设计的定制芯片Jalapeño", "芯片聚焦于提升推理性能、能效与系统扩展能力", "标志着OpenAI在自研AI硬件基础设施上的重要进展"], "badge": null, "title": "OpenAI and Broadcom unveil LLM-optimized inference chip", "url": "https://openai.com/index/openai-broadcom-jalapeno-inference-chip", "author": "OpenAI Blog", "published_at": "2026-06-24T06:00:00", "source_name": "OpenAI Blog", "source_type": "rss"}, {"id": 129, "category": "模型与能力", "title_zh": "GPT-5 帮助免疫学家 Derya Unutmaz 解开三年免疫学谜题", "summary": "OpenAI 博客文章介绍了 GPT-5 Pro 在免疫学研究中的应用。免疫学家 Derya Unutmaz 借助该模型，成功解决了一个困扰其团队三年的关于 T 细胞行为的谜题。这一突破性发现有望为癌症和自身免疫性疾病的研究提供新的见解与支持。", "highlights": ["GPT-5 Pro 辅助解决了长达三年的免疫学难题", "揭示了 T 细胞行为的新见解", "成果可能推动癌症和自身免疫疾病研究"], "badge": null, "title": "How GPT-5 helped immunologist Derya Unutmaz solve a 3-year-old mystery", "url": "https://openai.com/index/gpt-5-immunology-mystery", "author": "OpenAI Blog", "published_at": "2026-06-23T17:00:00", "source_name": "OpenAI Blog", "source_type": "rss"}, {"id": 130, "category": "观点与评论", "title_zh": "2026届ChatGPT未来之星：下一代AI领军者", "summary": "OpenAI 的“ChatGPT Futures, Class of 2026”项目采访了新一代 AI 领导者，探讨他们对人工智能未来的期望。受访者普遍希望 AI 能够弥合而非扩大社会差距，特别是在弱势群体教育机会方面，通过个性化学习解决教育不平等问题。他们期待 AI 能增加人际联系，减少屏幕沉迷时间，并从根本上重新思考医疗保健。此外，观点还包括利用 AI 重新评估不可能之事、提升个人创造力，并强调科技发展应始终秉持人道主义和乐观精神。最后，受访者寄语未来，鼓励自己不忘初心，做有意义的工作，并希望技术最终能让每个人生活得更美好、更充实，有更多时间从事自己热爱的事情。", "highlights": ["强调 AI 应弥合差距，特别是解决弱势群体教育机会不足的问题", "期待 AI 减少屏幕时间，增加真实的人际联系", "呼吁科技发展秉持人道主义和乐观精神，让生活更充实"], "badge": null, "title": "ChatGPT Futures, Class of 2026: The Next Generation of AI Leaders", "url": "https://www.youtube.com/shorts/mVpCDzoNtxA", "author": "OpenAI", "published_at": "2026-06-23T18:45:29", "source_name": "OpenAI", "source_type": "youtube"}, {"id": 131, "category": "行业与政策", "title_zh": "助力构建先进AI共享标准", "summary": "OpenAI 宣布通过支持 Appia 基金会，参与构建先进人工智能的共享标准。该倡议旨在推动建立评估框架、安全实践和全球合作机制，以应对前沿 AI 发展带来的挑战。OpenAI 此举体现了其参与行业标准制定、促进负责任 AI 发展的承诺，但文章未披露具体的标准内容或实施细节。", "highlights": ["OpenAI 通过 Appia 基金会推动先进 AI 共享标准建设", "聚焦评估框架、安全实践和全球合作三大方向", "体现行业头部企业参与国际 AI 治理标准制定的趋势"], "badge": null, "title": "Helping build shared standards for advanced AI", "url": "https://openai.com/index/helping-build-shared-standards-for-advanced-ai", "author": "OpenAI Blog", "published_at": "2026-06-23T13:00:00", "source_name": "OpenAI Blog", "source_type": "rss"}, {"id": 132, "category": "观点与评论", "title_zh": "扼杀企业文化的头号元凶", "summary": "Cerebras 的 Andrew Feldman 指出，快速成长公司面临的最大威胁并非竞争，而是变得厌恶风险。当公司规模达到1000至3000人时，文化容易从无所畏惧的工程探索，转变为只关注在下一个版本周期内能交付什么。他认为这种转变极具破坏性。Feldman 强调，Cerebras 的核心文化是聘用敢于挑战极限的人才，并守护一种“宁愿在追求非凡的过程中失败，也不愿在平凡中成功”的价值观，以此对抗规模化带来的保守倾向。", "highlights": ["公司规模化的最大弊病是变得厌恶风险，而非外部竞争。", "文化会从‘无所畏惧的工程’退化为‘下个版本能交付什么’。", "核心理念：宁可在追求非凡时失败，也不在平凡中成功。"], "badge": null, "title": "The #1 Thing That Kills Company Culture", "url": "https://www.youtube.com/shorts/4oF2tIb-lJs", "author": "No Priors: AI, Machine Learning, Tech, & Startups", "published_at": "2026-06-23T12:41:24", "source_name": "No Priors: AI, Machine Learning, Tech, & Startups", "source_type": "youtube"}, {"id": 133, "category": "观点与评论", "title_zh": "化解AI焦虑的良方", "summary": "本期节目探讨了如何应对人工智能带来的焦虑感。核心观点是培养成长型思维模式，始终保持学习态度。演讲者指出，过去让人成功的经验和方法在AI时代可能不再奏效，这种需要改变曾带来成功的行为模式会引发恐惧。面对这种恐惧，建议是积极面对，将注意力集中在可控范围内，主动思考“我能做些什么来改变现状”，而不是被动地认为坏事只是发生在自己身上。通过区分事情是“发生在你身上”还是“为你而发生”，可以重新获得掌控感，从而缓解因失控感而产生的挫败与焦虑。", "highlights": ["提出以成长型思维和学习态度作为应对AI焦虑的‘解药’", "指出改变曾带来成功的旧有模式是焦虑的重要来源", "建议通过聚焦可控行动来转化被动恐惧，重获掌控感"], "badge": null, "title": "The antidote for AI anxiety", "url": "https://www.youtube.com/shorts/D9gK7GD6AXg", "author": "Lenny's Podcast", "published_at": "2026-06-23T11:00:39", "source_name": "Lenny's Podcast", "source_type": "youtube"}, {"id": 134, "category": "产品与工具", "title_zh": "Omio 如何构建对话式旅行的未来", "summary": "本文介绍了旅行预订平台 Omio 如何利用 OpenAI 的技术构建对话式旅行体验。Omio 通过集成 OpenAI 的模型，打造了能够理解自然语言、提供个性化旅行建议的智能助手，使用户可以通过对话方式搜索和预订交通票务。此外，OpenAI 的工具还帮助 Omio 加速了产品开发流程，并推动其向 AI 原生公司转型，将人工智能深度融入核心业务与组织文化中。", "highlights": ["利用 OpenAI 模型打造自然语言旅行搜索与预订助手", "通过对话式界面提供个性化旅行建议", "借助 AI 加速产品开发并推动公司向 AI 原生转型"], "badge": null, "title": "How Omio is building the future of conversational travel", "url": "https://openai.com/index/omio", "author": "OpenAI Blog", "published_at": "2026-06-23T00:00:00", "source_name": "OpenAI Blog", "source_type": "rss"}, {"id": 135, "category": "研究与论文", "title_zh": "提示注入即角色混淆", "summary": "本文介绍了一项关于大语言模型（LLM）提示注入漏洞的研究。研究发现，模型在区分系统指令与用户输入时，更依赖文本的写作风格而非实际内容，这导致了严重的“角色混淆”问题。攻击者可以通过模仿模型内部思考块的写作风格，轻易绕过安全限制。实验表明，对攻击文本进行“去风格化”改写，能将攻击成功率从61%骤降至10%，但这种改写对人类而言几乎无法察觉。研究者指出，除非LLM能实现真正的角色感知，否则提示注入防御将是一场永无止境的“打地鼠”游戏。", "highlights": ["揭示了LLM更依赖文本风格而非内容来区分角色的关键漏洞", "发现通过简单的“去风格化”改写可大幅降低攻击成功率", "提出“角色混淆”是提示注入防御面临的核心挑战"], "badge": null, "title": "Prompt Injection as Role Confusion", "url": "https://simonwillison.net/2026/Jun/22/prompt-injection-as-role-confusion/#atom-everything", "author": "Simon Willison", "published_at": "2026-06-22T23:59:53", "source_name": "Simon Willison", "source_type": "rss"}, {"id": 136, "category": "工程与实践", "title_zh": "Fiona Fung 的 Claude 现在每天早上自动读取她的 Slack？", "summary": "Fiona Fung 在 Lenny's Podcast 中分享了她如何利用 AI 代理实现工作流的自动化。她指出，工程技术的下一个变革前沿是向异步编程和代理集群的转变。她以自身实践为例，过去她需要每天早上手动向 AI 发送提示，要求其检查 Slack 频道。而现在，她通过建立“例程”，让 AI 代理能够在每天固定的时间自动执行这些任务，无需人工干预。这体现了从同步执行提示到异步自动化工作流的抽象层次提升，使得工程师能够像部署一支特工队伍一样，让程序自动生成并运行提示。", "highlights": ["提出工程技术的前沿变革是从同步提示转向异步代理集群", "以自动检查 Slack 为例，展示了从手动输入到定时自动执行的转变", "强调通过建立“例程”实现抽象层次的提升，让 AI 代理自主工作"], "badge": null, "title": "Fiona Fung’s Claude now automatically reads her Slack every morning?", "url": "https://www.youtube.com/shorts/Dh50sbzOXfE", "author": "Lenny's Podcast", "published_at": "2026-06-23T00:50:01", "source_name": "Lenny's Podcast", "source_type": "youtube"}, {"id": 137, "category": "工程与实践", "title_zh": "将Moebius 0.2B图像修复模型移植到浏览器中运行", "summary": "作者Simon Willison利用Claude Code编程助手，成功将基于PyTorch和CUDA的Moebius 0.2B图像修复模型移植到浏览器中运行。整个过程采用“氛围编程”方式，作者未直接编写代码，而是通过指导Claude Code完成了模型格式转换（PyTorch到ONNX）、权重发布到Hugging Face、以及构建基于WebGPU和ONNX Runtime Web的交互式网页应用。最终演示页面可在Chrome、Firefox和Safari上运行，并利用CacheStorage API缓存约1.3GB的模型权重，实现了纯客户端的图像修复功能。文章详细记录了从可行性研究、环境搭建、编码调试到部署上线的完整流程，展示了现代AI编程助手在复杂工程任务中的潜力。", "highlights": ["成功将0.2B参数的图像修复模型从PyTorch/CUDA环境移植到浏览器WebGPU后端", "全程使用Claude Code进行“氛围编程”，作者未直接编写任何代码", "利用CacheStorage API解决了约1.3GB模型权重的浏览器缓存问题", "最终演示在Chrome、Firefox和Safari三大主流浏览器上均可运行"], "badge": null, "title": "Porting the Moebius 0.2B image inpainting model to run in the browser with Claude Code", "url": "https://simonwillison.net/2026/Jun/22/porting-moebius/#atom-everything", "author": "Simon Willison", "published_at": "2026-06-22T23:43:51", "source_name": "Simon Willison", "source_type": "rss"}, {"id": 138, "category": "行业与政策", "title_zh": "修补星球：OpenAI 推出支持开源维护者的 Daybreak 计划", "summary": "OpenAI 宣布推出名为“Patch the Planet”的 Daybreak 计划，旨在帮助开源项目维护者利用人工智能技术和专家审核来发现、验证并修复安全漏洞。该计划通过结合 AI 自动化分析与人工专业审查，提升开源软件的安全性，降低维护者应对漏洞的负担，体现了 OpenAI 对开源生态系统的支持。", "highlights": ["OpenAI 推出专门支持开源维护者的安全计划", "结合 AI 技术与专家审核来发现和修复漏洞", "旨在减轻开源维护者的安全维护负担"], "badge": null, "title": "Patch the Planet: a Daybreak initiative to support open source maintainers", "url": "https://openai.com/index/patch-the-planet", "author": "OpenAI Blog", "published_at": "2026-06-22T10:00:00", "source_name": "OpenAI Blog", "source_type": "rss"}, {"id": 139, "category": "产品与工具", "title_zh": "Daybreak：为全球组织提供安全防护的新工具", "summary": "OpenAI 发布了名为 Daybreak 的新安全工具套件，旨在帮助各类组织大规模地发现、验证和修复漏洞。该套件主要包括 Codex Security 和 GPT-5.5-Cyber 两款产品，通过人工智能技术提升网络安全防御的自动化水平和效率，使安全团队能够更快速、更精准地应对潜在威胁。", "highlights": ["推出 Daybreak 安全工具套件，聚焦漏洞管理全流程", "包含 Codex Security 和 GPT-5.5-Cyber 两款核心产品", "旨在实现漏洞发现、验证与修复的规模化与自动化"], "badge": null, "title": "Daybreak: Tools for securing every organization in the world", "url": "https://openai.com/index/daybreak-securing-the-world", "author": "OpenAI Blog", "published_at": "2026-06-22T10:00:00", "source_name": "OpenAI Blog", "source_type": "rss"}, {"id": 140, "category": "观点与评论", "title_zh": "2026届ChatGPT未来之星亮相", "summary": "OpenAI 发布的短片展示了“ChatGPT 2026届毕业生”如何将AI融入创新实践。作为首批完整经历大学ChatGPT时代的群体，他们分享了多个项目：从搜索1亿张星系图像的搜索引擎、为视障学生开发的教育游戏平台，到利用ChatGPT自学成为持照飞行员。其他项目涵盖国家安全AI研究、向国际空间站发射机器人、加速药物研发、优化约会体验、匹配无人认领的奖学金，以及在地震废墟中搜寻幸存者。视频强调，这是创造力与创意回报极高的时代，年轻一代正将新工具转化为推动现实世界进步的动力。", "highlights": ["展示首批完整经历大学ChatGPT时代的毕业生如何应用AI", "涵盖从天文搜索、无障碍教育到航天机器人的多元创新项目", "强调AI时代创造力的高回报与年轻建设者的现实影响力"], "badge": null, "title": "Meet the ChatGPT Futures, Class of 2026", "url": "https://www.youtube.com/shorts/GhCP2eDrKHk", "author": "OpenAI", "published_at": "2026-06-22T21:06:32", "source_name": "OpenAI", "source_type": "youtube"}, {"id": 141, "category": "产品与工具", "title_zh": "利用 Codex 进行长时间运行工作的上下文保持", "summary": "OpenAI 博客介绍了 Jason Liu 如何使用 Codex 来维护长时间运行任务中的上下文，管理复杂项目，并使工作能够跨越单次提示持续进行。文章展示了 Codex 在处理需要持续状态和记忆的编程任务时的实用技巧，帮助开发者更高效地利用 AI 辅助完成多步骤、长周期的开发工作。", "highlights": ["展示了 Codex 在长时间运行任务中保持上下文的能力", "提供了管理复杂项目和多步骤工作的实用方法", "帮助开发者突破单次提示的限制，实现持续协作"], "badge": null, "title": "Codex-maxxing for long-running work", "url": "https://openai.com/index/codex-maxxing-long-running-work", "author": "OpenAI Blog", "published_at": "2026-06-22T00:00:00", "source_name": "OpenAI Blog", "source_type": "rss"}, {"id": 142, "category": "行业与政策", "title_zh": "三星电子向全球员工部署ChatGPT企业版与Codex", "summary": "三星电子宣布向全球员工大规模部署ChatGPT Enterprise和Codex，这是OpenAI迄今为止规模最大的企业AI推广案例之一。该部署旨在提升员工生产力，将先进的对话式AI和代码生成能力整合到三星的日常工作流程中，标志着大型跨国企业在采用生成式AI工具方面迈出了重要一步。", "highlights": ["三星电子成为OpenAI最大规模企业部署案例之一", "同时引入ChatGPT Enterprise和Codex，覆盖对话与代码生成场景", "标志着大型跨国企业对生成式AI的深度整合"], "badge": null, "title": "Samsung Electronics brings ChatGPT and Codex to employees", "url": "https://openai.com/index/samsung-electronics-chatgpt-codex-deployment", "author": "OpenAI Blog", "published_at": "2026-06-21T23:00:00", "source_name": "OpenAI Blog", "source_type": "rss"}, {"id": 143, "category": "产品与工具", "title_zh": "Cloudflare 推出面向 AI 代理的临时账户功能", "summary": "Cloudflare 宣布了一项新功能，允许用户无需注册账户即可通过 `npx wrangler deploy --temporary` 命令部署临时 Workers 项目，项目默认存活 60 分钟。尽管该功能被宣传为“面向 AI 代理”，但作者认为它对所有开发者都很有用。作者使用 GPT-5.5 在 Codex Desktop 中构建了一个 HTTP 重定向追踪工具，并成功通过该临时部署功能上线。部署完成后会提供一个链接，用户可凭此认领项目以延长其生命周期。该消息源自 Hacker News。", "highlights": ["无需注册 Cloudflare 账户即可部署临时 Workers 项目", "项目默认存活 60 分钟，提供认领链接以延长生命周期", "作者实测结合 AI 编码工具快速构建并部署了测试应用"], "badge": null, "title": "Temporary Cloudflare Accounts for AI agents", "url": "https://simonwillison.net/2026/Jun/21/temporary-cloudflare-accounts/#atom-everything", "author": "Simon Willison", "published_at": "2026-06-21T22:01:04", "source_name": "Simon Willison", "source_type": "rss"}]};</script>
  <script>
(function () {
  const DATA = window.__ISSUE_DATA__;
  const state = { viewMode: 'category', filter: 'all' };

  function itemPublishedAt(item) {
    const t = Date.parse(item.published_at);
    return Number.isNaN(t) ? 0 : t;
  }

  function sortItemsByTimeDesc(items) {
    return [...items].sort((a, b) => itemPublishedAt(b) - itemPublishedAt(a));
  }

  function groupItemsByCategory(items) {
    const map = new Map();
    for (const item of items) {
      const cat = (item.category || '').trim() || '未分类';
      if (!map.has(cat)) map.set(cat, []);
      map.get(cat).push(item);
    }
    return [...map.entries()]
      .map(([category, groupItems]) => ({ category, items: sortItemsByTimeDesc(groupItems) }))
      .sort((a, b) => b.items.length - a.items.length || a.category.localeCompare(b.category, 'zh-CN'));
  }

  function groupItemsByAuthor(items) {
    const map = new Map();
    for (const item of items) {
      const author = (item.author || '').trim() || '未知作者';
      if (!map.has(author)) map.set(author, []);
      map.get(author).push(item);
    }
    return [...map.entries()]
      .map(([category, groupItems]) => ({ category, items: sortItemsByTimeDesc(groupItems) }))
      .sort((a, b) => {
        const latestA = Math.max(...a.items.map(itemPublishedAt));
        const latestB = Math.max(...b.items.map(itemPublishedAt));
        return latestB - latestA || a.category.localeCompare(b.category, 'zh-CN');
      });
  }

  function sectionIdForView(mode, key) {
    const prefix = mode === 'author' ? 'review-author-' : 'review-cat-';
    return prefix + encodeURIComponent(key);
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatRange(since, until) {
    if (!since || !until) return '';
    const fmt = (iso) => {
      const d = new Date(iso);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}.${m}.${day}`;
    };
    const end = new Date(until);
    end.setDate(end.getDate() - 1);
    return `${fmt(since)} — ${fmt(end.toISOString())}`;
  }

  function formatDate(iso) {
    try {
      return new Date(iso).toLocaleDateString('zh-CN');
    } catch {
      return iso;
    }
  }

  function sourceIcon(type) {
    const normalized = (type || 'unknown').toLowerCase();
    const cls = ['rss', 'youtube'].includes(normalized) ? normalized : 'unknown';
    const paths = {
      rss: '<path d="M6.18 15.64a2.18 2.18 0 0 1 2.18 2.18C8.36 19 7.38 20 6.18 20 5 20 4 19 4 17.82 4 16.64 5 15.64 6.18 15.64zM4 4.44A15.9 15.9 0 0 1 19.56 20h-2.83A13.07 13.07 0 0 0 4 7.27V4.44zm0 5.66a9.25 9.25 0 0 1 9.25 9.25h-2.83A6.42 6.42 0 0 0 4 12.93v-2.83z"/>',
      youtube: '<path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.3 31.3 0 0 0 0 12a31.3 31.3 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.3 31.3 0 0 0 24 12a31.3 31.3 0 0 0-.5-5.8zM9.75 15.02V8.98L15.5 12l-5.75 3.02z"/>',
      unknown: '<path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>',
    };
    const size = 11;
    const svg = cls === 'unknown'
      ? `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${paths.unknown}</svg>`
      : `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${paths[cls]}</svg>`;
    return `<span class="source-type-icon source-type-icon--${cls}"><span class="source-type-icon__glyph">${svg}</span></span>`;
  }

  function renderTitle(title, titleZh) {
    const en = (title || '').trim();
    const zh = (titleZh || '').trim();
    if (zh && zh !== en) {
      return `<span class="item-title"><span class="item-title__zh">${escapeHtml(zh)}</span><span class="item-title__en" lang="en">${escapeHtml(en)}</span></span>`;
    }
    return `<span class="item-title item-title--single">${escapeHtml(en)}</span>`;
  }

  function renderCard(item) {
    const highlights = (item.highlights || []).length
      ? `<div class="insight"><div class="insight-label">亮点</div><ul style="margin:0.5rem 0 0;padding-left:1.2rem;">${item.highlights.map((h) => `<li>${escapeHtml(h)}</li>`).join('')}</ul></div>`
      : '';
    const badge = item.badge ? `<span class="badge">${escapeHtml(item.badge)}</span>` : '';
    return `<article class="card card--readonly">
      <div class="card-head">
        <h3>${sourceIcon(item.source_type)}${renderTitle(item.title, item.title_zh)}</h3>
        ${badge}
      </div>
      <p class="card-summary">${escapeHtml(item.summary)}</p>
      ${highlights}
      <div class="meta">
        <span>${escapeHtml(item.author || '—')} · ${escapeHtml(item.source_name)} · ${escapeHtml(formatDate(item.published_at))}</span>
        <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">原文</a>
      </div>
    </article>`;
  }

  function pickFilter(cat) {
    state.filter = cat;
    if (cat === 'all') {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      const el = document.getElementById(sectionIdForView(state.viewMode, cat));
      el?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    render();
  }

  function setViewMode(mode) {
    state.viewMode = mode;
    state.filter = 'all';
    render();
  }

  function render() {
    const items = DATA.items || [];
    const groups = state.viewMode === 'author' ? groupItemsByAuthor(items) : groupItemsByCategory(items);
    const counts = Object.fromEntries(groups.map((g) => [g.category, g.items.length]));
    const categories = groups.map((g) => g.category);
    const visibleGroups = state.filter === 'all' ? groups : groups.filter((g) => g.category === state.filter);
    const navLabel = state.viewMode === 'author' ? '作者导航' : '分类导航';
    const jumpLabel = state.viewMode === 'author' ? '选择作者' : '选择分类';
    const useScroll = categories.length > 4;

    const navItems = categories.map((cat) => {
      const active = state.filter === cat ? ' is-active' : '';
      return `<button type="button" class="category-nav__item${active}" data-filter="${escapeHtml(cat)}"><span class="category-nav__label">${escapeHtml(cat)}</span><span class="category-nav__count">${counts[cat] ?? 0}</span></button>`;
    }).join('');

    const selectOptions = [`<option value="all"${state.filter === 'all' ? ' selected' : ''}>全部（${items.length}）</option>`]
      .concat(categories.map((cat) => `<option value="${escapeHtml(cat)}"${state.filter === cat ? ' selected' : ''}>${escapeHtml(cat)}（${counts[cat] ?? 0}）</option>`))
      .join('');

    const sections = visibleGroups.length
      ? visibleGroups.map((group) => `<section class="review-section" id="${sectionIdForView(state.viewMode, group.category)}"><div class="review-section__head"><h2 class="review-section__title">${escapeHtml(group.category)}</h2><span class="review-section__count">${group.items.length} 条</span></div><div class="review-section__rule"></div>${group.items.map(renderCard).join('')}</section>`).join('')
      : '<p class="empty">该期暂无已发布条目。</p>';

    const root = document.getElementById('app');
    root.innerHTML = `
      <div class="section-header review-page__toolbar">
        <h1 style="margin:0;">AI 周刊 2026-W26</h1>
        <span style="color:var(--text-muted);">${items.length} 条</span>
      </div>
      <header class="issue-masthead">
        <p class="issue-masthead__label">ISSUE · ${escapeHtml(DATA.week_label)}</p>
        ${DATA.range ? `<p class="issue-masthead__range">${escapeHtml(DATA.range)}</p>` : ''}
      </header>
      <div class="review-view-toggle" role="group" aria-label="列表视角">
        <button type="button" class="review-view-toggle__btn${state.viewMode === 'category' ? ' is-active' : ''}" data-view="category">按分类</button>
        <button type="button" class="review-view-toggle__btn${state.viewMode === 'author' ? ' is-active' : ''}" data-view="author">按作者</button>
      </div>
      <div class="category-nav-wrap">
        <nav class="category-nav${useScroll ? ' category-nav--scroll' : ''}" aria-label="${navLabel}">
          <button type="button" class="category-nav__item${state.filter === 'all' ? ' is-active' : ''}" data-filter="all">全部<span class="category-nav__count">${items.length}</span></button>
          ${navItems}
        </nav>
        <label class="category-nav-select">
          <span class="visually-hidden">跳转</span>
          <select aria-label="${jumpLabel}">${selectOptions}</select>
        </label>
      </div>
      <div id="sections">${sections}</div>`;

    root.querySelectorAll('[data-view]').forEach((btn) => {
      btn.addEventListener('click', () => setViewMode(btn.getAttribute('data-view')));
    });
    root.querySelectorAll('[data-filter]').forEach((btn) => {
      btn.addEventListener('click', () => pickFilter(btn.getAttribute('data-filter')));
    });
    const select = root.querySelector('.category-nav-select select');
    select?.addEventListener('change', (e) => pickFilter(e.target.value));
  }

  DATA.range = formatRange(DATA.since, DATA.until);
  render();
})();
</script>
</body>
</html>
